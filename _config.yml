title: xiaosy · 个人博客
description: xiaosy 的个人博客：记录代码、思考与折腾的乐趣。
url: "https://yangqianjing.github.io"
baseurl: "/Y"
markdown: kramdown
permalink: /:year/:month/:day/:title/
excerpt_separator: "<!-- more -->"
collections:
  notes:
    output: true
    permalink: /notes/:title/
defaults:
  - scope:
      path: ""
      type: notes
    values:
      layout: post
exclude:
  - README.md
  - 1.txt
